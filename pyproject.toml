[project]
name = "grtpl"
version = "0.1.0"
description = "Generative real-time phase lock prediction from hippocampal LFP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "plotly>=5.22",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
